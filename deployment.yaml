apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cloud-demo

  template:
    metadata:
      labels:
        app: cloud-demo

    spec:
      containers:
        - name: cloud-demo
          image: cloud-demo:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: APP_VERSION
              value: "v2"

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10